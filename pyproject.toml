[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-tools"
version = "0.1.0"
description = "Utility collection for behavioral neuroscience: dataset collection, video splitting, super-resolution, and annotation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Joon"},
]

dependencies = [
    "numpy>=1.24",
    "pillow>=9.0",
    "tqdm>=4.62",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
collection = [
    "transformers>=4.30",
    "torch>=2.0",
    "scikit-learn>=1.2",
    "beautifulsoup4>=4.12",
    "requests>=2.28",
    "pandas>=2.0",
]
splitter = [
    "opencv-python>=4.8",
]
superres = [
    "torch>=2.0",
    "realesrgan>=0.3",
    "basicsr>=1.4",
]
all = ["behavior-tools[collection,splitter,superres]"]
dev = [
    "behavior-tools[all]",
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
